name: vendora_app
description: Vendora POS & E-Commerce Management Platform
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.6.1

  # Dependency Injection
  get_it: ^8.0.2
  injectable: ^2.5.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Functional Programming
  dartz: ^0.10.1

  # UI & Design
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Charts
  fl_chart: ^0.69.0

  # Tables
  data_table_2: ^2.5.12

  # Formatting & i18n
  intl: ^0.20.2

  # Image
  image_picker: ^1.1.2

  # PDF & Export
  pdf: ^3.11.1
  printing: ^5.13.2
  excel: ^4.0.6

  # Permissions
  permission_handler: ^11.3.1

  # Responsive
  responsive_framework: ^1.5.1

  # Date Picker
  table_calendar: ^3.1.2

  # File picking
  file_picker: ^8.1.2

  # QR Code
  qr_flutter: ^4.1.0

  # URL launcher
  url_launcher: ^6.3.1

  # Web platform views
  web: ^1.1.0

  # Misc
  uuid: ^4.5.1
  logger: ^2.5.0
  path_provider: ^2.1.5

  # Firebase
  firebase_core: ^4.5.0
  firebase_analytics: ^12.1.3
  firebase_messaging: ^16.1.2
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.0.2
  device_info_plus: ^10.1.2
  package_info_plus: ^8.1.0
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  injectable_generator: ^2.7.0
  build_runner: ^2.4.13
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/i18n/

  fonts:
    - family: Geist
      fonts:
        - asset: fonts/Geist-Regular.ttf
          weight: 400
        - asset: fonts/Geist-Medium.ttf
          weight: 500
        - asset: fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: fonts/Geist-Bold.ttf
          weight: 700
